<!doctype html><html lang="en"><head><meta charset="utf-8"><title>frameact — motion</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#ebedf5;--ink:#10131f;--cobalt:#2743ff;--mute:#6b7290;--D:6.5s;--ease:cubic-bezier(.2,.8,.2,1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Mono",monospace;position:relative}
.stage{position:absolute;inset:0;animation:stage var(--D) linear infinite}
@keyframes stage{0%,90.8%{opacity:1}100%{opacity:0}}

/* labels */
.lbl{position:absolute;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);opacity:0;transform:translateY(8px)}
.lbl b{color:var(--cobalt);font-weight:500}
.l1{left:88px;top:84px;animation:rise var(--D) var(--ease) infinite}
.l2{left:88px;top:386px;animation:rise2 var(--D) var(--ease) infinite}
@keyframes rise{0%,1.5%{opacity:0;transform:translateY(8px)}9.2%,100%{opacity:1;transform:none}}
@keyframes rise2{0%,46%{opacity:0;transform:translateY(8px)}54%,100%{opacity:1;transform:none}}

/* wordmark: SVG so the outline can draw itself */
.word{position:absolute;left:78px;top:150px;width:1140px;height:200px}
.word text{font-family:Archivo,sans-serif;font-stretch:125%;font-weight:900;font-size:196px;letter-spacing:-.04em}
.word .outline{fill:none;stroke:var(--ink);stroke-width:3;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw var(--D) ease-in-out infinite}
@keyframes draw{0%,6.2%{stroke-dashoffset:1400}33.8%,100%{stroke-dashoffset:0}}
.word .filled{fill:var(--ink);clip-path:url(#commit)}
#commit rect{transform:scaleX(0);transform-origin:0 0;animation:commit var(--D) cubic-bezier(.6,0,.3,1) infinite}
@keyframes commit{0%,32.3%{transform:scaleX(0)}53.8%,100%{transform:scaleX(1)}}

/* the frame tick: grows left→right, a bright head leads it */
.tick{position:absolute;left:0;right:0;top:256px;height:4px;background:var(--cobalt);transform:scaleX(0);transform-origin:0 50%;animation:sweep var(--D) cubic-bezier(.6,0,.3,1) infinite}
@keyframes sweep{0%,32.3%{transform:scaleX(0)}53.8%,100%{transform:scaleX(1)}}
.dot{position:absolute;left:88px;top:246px;width:24px;height:24px;border-radius:50%;background:var(--cobalt);transform:scale(0);animation:pop var(--D) var(--ease) infinite}
@keyframes pop{0%,30%{transform:scale(0)}36%,100%{transform:scale(1)}}
.head{position:absolute;left:-14px;top:244px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,#fff 0%,rgba(255,255,255,.9) 25%,rgba(39,67,255,0) 70%);opacity:0;animation:head var(--D) cubic-bezier(.6,0,.3,1) infinite}
@keyframes head{0%,32.3%{transform:translateX(0);opacity:0}34%{opacity:1}52%{opacity:1}53.8%{transform:translateX(1280px);opacity:0}100%{transform:translateX(1280px);opacity:0}}

/* tagline + meta */
.tag{position:absolute;left:88px;top:470px;width:760px;font-family:Archivo,sans-serif;font-stretch:125%;font-weight:900;font-size:34px;line-height:1.15;letter-spacing:-.02em}
.tag .acc{color:var(--cobalt)}
.tag .ln{display:block;overflow:hidden;padding-bottom:.12em;margin-bottom:-.12em}
.tag .ln i{display:block;font-style:normal;transform:translateY(110%);animation:up var(--D) var(--ease) infinite}
.tag .ln:nth-child(2) i{animation-name:up2}
@keyframes up{0%,54%{transform:translateY(110%)}62%,100%{transform:none}}
@keyframes up2{0%,57%{transform:translateY(110%)}65%,100%{transform:none}}
.meta{position:absolute;right:88px;top:470px;text-align:right;font-size:15px;line-height:1.9;color:var(--mute)}
.meta b{color:var(--ink);font-weight:500}
.meta div{opacity:0;transform:translateX(10px);animation:slide var(--D) var(--ease) infinite}
.meta div:nth-child(2){animation-name:slide2}.meta div:nth-child(3){animation-name:slide3}
@keyframes slide{0%,58%{opacity:0;transform:translateX(10px)}65%,100%{opacity:1;transform:none}}
@keyframes slide2{0%,61%{opacity:0;transform:translateX(10px)}68%,100%{opacity:1;transform:none}}
@keyframes slide3{0%,64%{opacity:0;transform:translateX(10px)}71%,100%{opacity:1;transform:none}}

/* ms scale: progress follows the head */
.bar{position:absolute;left:88px;right:88px;top:560px;height:1px;background:rgba(16,19,31,.2)}
.bar i{position:absolute;inset:0;background:var(--cobalt);transform:scaleX(0);transform-origin:0 0;animation:sweep var(--D) cubic-bezier(.6,0,.3,1) infinite}
.ms{position:absolute;top:572px;font-size:13px;color:var(--mute);letter-spacing:.06em;opacity:0;animation:ms var(--D) var(--ease) infinite}
.ms.m2{animation-name:ms2}.ms.m3{animation-name:ms3}
@keyframes ms{0%,32%{opacity:0}36%,100%{opacity:1}}
@keyframes ms2{0%,42%{opacity:0}46%,100%{opacity:1}}
@keyframes ms3{0%,52%{opacity:0}56%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style></head><body>
<div class="stage">
  <div class="lbl l1">phase 1 · <b>measure</b> — read layout, pure compute</div>
  <svg class="word" viewBox="0 0 1140 200" xmlns="http://www.w3.org/2000/svg">
    <defs><clipPath id="commit" clipPathUnits="userSpaceOnUse"><rect x="0" y="106" width="1140" height="100"/></clipPath></defs>
    <text class="outline" x="0" y="172">frameact</text>
    <text class="filled" x="0" y="172">frameact</text>
  </svg>
  <div class="tick"></div>
  <div class="head"></div>
  <div class="dot"></div>
  <div class="lbl l2">phase 2 · <b>mutate</b> — write DOM, once, in order</div>
  <div class="tag"><span class="ln"><i>Fine-grained signals.</i></span><span class="ln"><i>One commit <span class="acc">per frame.</span></i></span></div>
  <div class="meta"><div><b>no VDOM</b> · no re-render</div><div><b>rAF</b>-scheduled effects</div><div><b>stricterdom</b> catches phase violations</div></div>
  <div class="bar"><i></i></div>
  <div class="ms" style="left:88px">0 ms</div>
  <div class="ms m2" style="left:50%;transform:translateX(-50%)">8.3 ms</div>
  <div class="ms m3" style="right:88px">16.7 ms</div>
</div>
</body></html>
